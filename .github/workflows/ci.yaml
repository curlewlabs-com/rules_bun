name: CI

on:
  push:
    branches: [main]
  # Stacked pull requests need the same required checks before they reach main.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_name == 'main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  integration-test:
    name: Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Standard public-repository runners avoid metered larger runners.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    # macOS runs slowest: the whole job, the npm fixture's cold units in both
    # representations included, takes about nine minutes there.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          # Cold acquisitions are part of the evidence; no cache storage is needed.
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      - name: Extract public API documentation
        run: bazel build //bun:api_docs //npm:api_docs
      - name: Per-package npm rules
        run: bazel test //npm/... //tests/npm/... //tools/...
      # Archive units are macOS-only; with no store set the helper expands
      # into a private one, which exercises every step but reuse.
      - name: Per-package npm rules with macOS archive units
        if: runner.os == 'macOS'
        run: bazel test --//npm:macos_archives //tests/npm/...
      - name: Workspace acquisition and rejection cases
        run: python3 tests/check.py
      - name: Incremental and concurrent acquisition
        run: python3 tests/check_state.py
      - name: Verify prepared release archive without dev dependencies
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 tools/prepare_release.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      # Candidate verification uses a local registry, bypassing the example pin.
      - name: Exercise the published-release example
        run: python3 examples/consumer/run.py

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned tools
        run: python3 -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The type check has a package of its own: the root package.json and
    # bun.lock are the workspace the acquisition tests install.
    defaults:
      run:
        working-directory: tools/typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      # The Bun the tests acquire with, so the check needs no second Bun pin.
      - name: Put the tests' Bun on PATH
        run: |
          bazel build @test_bun//:bun
          bun="$(bazel info output_base)/$(bazel cquery @test_bun//:bun --output=files)"
          dirname "$bun" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: tsc --noEmit
        run: bun run typecheck
      - uses: curlewlabs-com/ci-baseline/typed@6a09b1b1ebea0453f9a34fce974610ef2544ec3a # v0.3.0

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
          cache-save: false
      # npm/npm_tarball.py imports rules_archive_store's libraries, which Bazel
      # puts on the path from that module's repository and the repository does
      # not track. pyright resolves them from the fetched repository.
      - name: Fetch rules_archive_store
        id: archive-store
        run: |
          bazel fetch --repo=@curlewlabs_rules_archive_store
          echo "path=$(bazel info output_base)/external/curlewlabs_rules_archive_store+/archive_store" >> "$GITHUB_OUTPUT"
      - uses: curlewlabs-com/ci-baseline@6a09b1b1ebea0453f9a34fce974610ef2544ec3a # v0.3.0
        with:
          python-search-paths: ${{ steps.archive-store.outputs.path }}

  conclusion:
    needs: [integration-test, lint, typecheck, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every integration and lint job to pass
        env:
          INTEGRATION: ${{ needs.integration-test.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$INTEGRATION" = success && test "$LINT" = success && test "$TYPECHECK" = success && test "$BASELINE" = success
